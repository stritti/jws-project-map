# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      official-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "oven-sh/*"
          - "googleapis/*"

  # Maintain dependencies for Bun
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # TypeScript 7.x ships no programmatic compiler API yet; vue-tsc
      # (Volar) and typescript-eslint still require the TypeScript 6 API.
      # Re-evaluate once vue-tsc/typescript-eslint support TS 7.1+.
      - dependency-name: "typescript"
        versions: ["7.x", ">=7.0.0"]
    # Groups only bundle minor/patch updates; major updates stay individual PRs.
    # Order matters: the first matching group wins.
    groups:
      typescript-toolchain:
        update-types: ["minor", "patch"]
        patterns:
          - "typescript"
          - "vue-tsc"
          - "typescript-eslint"
      maps-leaflet:
        update-types: ["minor", "patch"]
        patterns:
          - "leaflet*"
          - "@vue-leaflet/*"
          - "vue-leaflet*"
      lint-format:
        update-types: ["minor", "patch"]
        patterns:
          - "eslint*"
          - "prettier"
          - "@vue/eslint-*"
          - "@rushstack/*"
      vue-ecosystem:
        update-types: ["minor", "patch"]
        patterns:
          - "vue*"
          - "@vue/*"
          - "pinia*"
      build-tooling:
        update-types: ["minor", "patch"]
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "@iconify-json/*"
          - "rollup"
          - "@rollup/*"
          - "esbuild"
          - "postcss"
          - "autoprefixer"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "unplugin-*"
          - "workbox-*"
          - "npm-run-all"
      testing:
        update-types: ["minor", "patch"]
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      ci-dev-tooling:
        update-types: ["minor", "patch"]
        patterns:
          - "release-please"
          - "@commitlint/*"
          - "commitizen"
          - "git-cz"
          - "cz-conventional-changelog"
          - "@lhci/*"
          - "@netlify/*"
          - "@modelcontextprotocol/*"
          - "sharp"
      types:
        update-types: ["minor", "patch"]
        patterns:
          - "@types/*"
      runtime-libs:
        update-types: ["minor", "patch"]
        patterns:
          - "dompurify"
          - "marked"
          - "fuse.js"
          - "flag-icons"
          - "caniuse-lite"
          - "baseline-browser-mapping"
          - "@popperjs/core"
