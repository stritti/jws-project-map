name: Accessibility Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173 >/dev/null || (echo "preview server failed to start" && exit 1)

      - name: Setup Chrome (with matching ChromeDriver)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run axe-core accessibility checks
        run: >-
          npx --yes @axe-core/cli http://localhost:4173
          --chrome-path "${{ steps.setup-chrome.outputs.chrome-path }}"
          --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}"
          --exit --save axe-results.json

      - name: Upload axe results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-accessibility-results
          path: axe-results.json
          retention-days: 7

  lighthouse-a11y:
    runs-on: ubuntu-latest
    needs: accessibility
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173 >/dev/null || (echo "preview server failed to start" && exit 1)

      - name: Run Lighthouse accessibility audit
        run: npx --yes lighthouse http://localhost:4173 --preset=desktop --only-categories=accessibility --output=json --output-path=./lighthouse-results.json --chrome-flags="--headless=new --no-sandbox"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-a11y-results
          path: lighthouse-results.json
          retention-days: 7
