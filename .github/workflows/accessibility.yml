name: Accessibility Checks
on: [push, pull_request]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Install axe-core CLI
        run: bun add -g axe-cli

      - name: Start local server
        run: |
          bun run preview &
          sleep 5
        env:
          NODE_OPTIONS: --unhandled-rejections=strict

      - name: Run axe-core accessibility checks
        run: |
          npx axe http://localhost:4173 --save axe-results.json --exit || true
        continue-on-error: true
        env:
          NODE_OPTIONS: --unhandled-rejections=strict

      - name: Upload axe results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-accessibility-results
          path: axe-results.json
          retention-days: 7

  lighthouse-a11y:
    runs-on: ubuntu-latest
    needs: accessibility
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Run Lighthouse accessibility audit
        run: |
          npx lighthouse http://localhost:4173 --output=json --output-path=./lighthouse-results.json --chrome-flags="--headless" || true
        continue-on-error: true
        env:
          LHCI_COLLECT__URL: http://localhost:4173

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-a11y-results
          path: lighthouse-results.json
          retention-days: 7
