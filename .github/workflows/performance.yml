name: Performance Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (with bundle budget)
        run: bun run build:prod

      - name: Run Lighthouse CI (static dist)
        run: |
          bunx lhci autorun \
            --collect.staticDistDir=dist \
            --upload.target=filesystem \
            --upload.outputDir=.lighthouseci

      - name: Upload Lighthouse HTML reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Restore Lighthouse baseline (main)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .lighthouse-baseline/baseline.json
          key: lighthouse-baseline-${{ github.run_id }}
          restore-keys: |
            lighthouse-baseline-

      - name: Extract Lighthouse metrics
        id: lhmetrics
        run: |
          REPORT=$(ls .lighthouseci/lhr-*.json 2>/dev/null | head -n 1)
          # Prefer the report of the app entry page over other pages (e.g. iframe-preview)
          for f in .lighthouseci/lhr-*.json; do
            if grep -q '"finalDisplayedUrl": "http://localhost:[0-9]*/index.html"' "$f"; then
              REPORT="$f"
              break
            fi
          done
          if [ -z "$REPORT" ]; then
            echo "No Lighthouse report found"
            exit 1
          fi
          SCORE=$(jq '.categories.performance.score' "$REPORT")
          A11Y=$(jq '.categories.accessibility.score' "$REPORT")
          BP=$(jq '.categories["best-practices"].score' "$REPORT")
          SEO=$(jq '.categories.seo.score' "$REPORT")
          PWA=$(jq '.categories.pwa.score' "$REPORT")
          LCP=$(jq '.audits["largest-contentful-paint"].numericValue' "$REPORT")
          TBT=$(jq '.audits["total-blocking-time"].numericValue' "$REPORT")
          CLS=$(jq '.audits["cumulative-layout-shift"].numericValue' "$REPORT")
          BYTE=$(jq '.audits["total-byte-weight"].numericValue' "$REPORT")
          FCP=$(jq '.audits["first-contentful-paint"].numericValue' "$REPORT")
          SPEEDINDEX=$(jq '.audits["speed-index"].numericValue' "$REPORT")
          echo "SCORE=$SCORE" >> $GITHUB_OUTPUT
          echo "A11Y=$A11Y" >> $GITHUB_OUTPUT
          echo "BP=$BP" >> $GITHUB_OUTPUT
          echo "SEO=$SEO" >> $GITHUB_OUTPUT
          echo "PWA=$PWA" >> $GITHUB_OUTPUT
          echo "LCP=$LCP" >> $GITHUB_OUTPUT
          echo "TBT=$TBT" >> $GITHUB_OUTPUT
          echo "CLS=$CLS" >> $GITHUB_OUTPUT
          echo "BYTE=$BYTE" >> $GITHUB_OUTPUT
          echo "FCP=$FCP" >> $GITHUB_OUTPUT
          echo "SPEEDINDEX=$SPEEDINDEX" >> $GITHUB_OUTPUT

          BASELINE_FILE=".lighthouse-baseline/baseline.json"
          BASE_SCORE="none"; BASE_A11Y="none"; BASE_BP="none"; BASE_SEO="none"; BASE_PWA="none"
          BASE_LCP="none"; BASE_TBT="none"; BASE_CLS="none"; BASE_FCP="none"; BASE_SI="none"; BASE_BYTE="none"
          if [ -f "$BASELINE_FILE" ]; then
            BASE_SCORE=$(jq -r '.score' "$BASELINE_FILE")
            BASE_A11Y=$(jq -r '.a11y' "$BASELINE_FILE")
            BASE_BP=$(jq -r '.bp' "$BASELINE_FILE")
            BASE_SEO=$(jq -r '.seo' "$BASELINE_FILE")
            BASE_PWA=$(jq -r '.pwa' "$BASELINE_FILE")
            BASE_LCP=$(jq -r '.lcp' "$BASELINE_FILE")
            BASE_TBT=$(jq -r '.tbt' "$BASELINE_FILE")
            BASE_CLS=$(jq -r '.cls' "$BASELINE_FILE")
            BASE_FCP=$(jq -r '.fcp' "$BASELINE_FILE")
            BASE_SI=$(jq -r '.si' "$BASELINE_FILE")
            BASE_BYTE=$(jq -r '.byte' "$BASELINE_FILE")
          fi
          echo "BASE_SCORE=$BASE_SCORE" >> $GITHUB_OUTPUT
          echo "BASE_A11Y=$BASE_A11Y" >> $GITHUB_OUTPUT
          echo "BASE_BP=$BASE_BP" >> $GITHUB_OUTPUT
          echo "BASE_SEO=$BASE_SEO" >> $GITHUB_OUTPUT
          echo "BASE_PWA=$BASE_PWA" >> $GITHUB_OUTPUT
          echo "BASE_LCP=$BASE_LCP" >> $GITHUB_OUTPUT
          echo "BASE_TBT=$BASE_TBT" >> $GITHUB_OUTPUT
          echo "BASE_CLS=$BASE_CLS" >> $GITHUB_OUTPUT
          echo "BASE_FCP=$BASE_FCP" >> $GITHUB_OUTPUT
          echo "BASE_SI=$BASE_SI" >> $GITHUB_OUTPUT
          echo "BASE_BYTE=$BASE_BYTE" >> $GITHUB_OUTPUT

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            mkdir -p .lighthouse-baseline
            jq -n \
              --argjson score "$SCORE" --argjson a11y "$A11Y" --argjson bp "$BP" \
              --argjson seo "$SEO" --argjson pwa "$PWA" \
              --argjson lcp "$LCP" --argjson tbt "$TBT" --argjson cls "$CLS" \
              --argjson fcp "$FCP" --argjson si "$SPEEDINDEX" --argjson byte "$BYTE" \
              '{score:$score, a11y:$a11y, bp:$bp, seo:$seo, pwa:$pwa, lcp:$lcp, tbt:$tbt, cls:$cls, fcp:$fcp, si:$si, byte:$byte}' \
              > "$BASELINE_FILE"
          fi

      - name: Save Lighthouse baseline (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .lighthouse-baseline/baseline.json
          key: lighthouse-baseline-${{ github.run_id }}

      - name: Publish Lighthouse summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## 🚀 Lighthouse Performance Report

          | Metric | Value |
          |--------|-------|
          | Performance Score | ${{ steps.lhmetrics.outputs.SCORE }} |
          | Accessibility Score | ${{ steps.lhmetrics.outputs.A11Y }} |
          | Best Practices Score | ${{ steps.lhmetrics.outputs.BP }} |
          | SEO Score | ${{ steps.lhmetrics.outputs.SEO }} |
          | PWA Score | ${{ steps.lhmetrics.outputs.PWA }} |
          | LCP (Largest Contentful Paint) | ${{ steps.lhmetrics.outputs.LCP }} ms |
          | TBT (Total Blocking Time) | ${{ steps.lhmetrics.outputs.TBT }} ms |
          | CLS (Cumulative Layout Shift) | ${{ steps.lhmetrics.outputs.CLS }} |
          | FCP (First Contentful Paint) | ${{ steps.lhmetrics.outputs.FCP }} ms |
          | Speed Index | ${{ steps.lhmetrics.outputs.SPEEDINDEX }} ms |
          | Total Byte Weight | ${{ steps.lhmetrics.outputs.BYTE }} bytes |

          Core Web Vitals thresholds: LCP ≤ 2500 ms · TBT ≤ 300 ms · CLS ≤ 0.1
          EOF


      - name: Comment or Update PR with Lighthouse metrics
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          SCORE: ${{ steps.lhmetrics.outputs.SCORE }}
          A11Y: ${{ steps.lhmetrics.outputs.A11Y }}
          BP: ${{ steps.lhmetrics.outputs.BP }}
          SEO: ${{ steps.lhmetrics.outputs.SEO }}
          PWA: ${{ steps.lhmetrics.outputs.PWA }}
          LCP: ${{ steps.lhmetrics.outputs.LCP }}
          TBT: ${{ steps.lhmetrics.outputs.TBT }}
          CLS: ${{ steps.lhmetrics.outputs.CLS }}
          BYTE: ${{ steps.lhmetrics.outputs.BYTE }}
          FCP: ${{ steps.lhmetrics.outputs.FCP }}
          SPEEDINDEX: ${{ steps.lhmetrics.outputs.SPEEDINDEX }}
          BASE_SCORE: ${{ steps.lhmetrics.outputs.BASE_SCORE }}
          BASE_A11Y: ${{ steps.lhmetrics.outputs.BASE_A11Y }}
          BASE_BP: ${{ steps.lhmetrics.outputs.BASE_BP }}
          BASE_SEO: ${{ steps.lhmetrics.outputs.BASE_SEO }}
          BASE_PWA: ${{ steps.lhmetrics.outputs.BASE_PWA }}
          BASE_LCP: ${{ steps.lhmetrics.outputs.BASE_LCP }}
          BASE_TBT: ${{ steps.lhmetrics.outputs.BASE_TBT }}
          BASE_CLS: ${{ steps.lhmetrics.outputs.BASE_CLS }}
          BASE_FCP: ${{ steps.lhmetrics.outputs.BASE_FCP }}
          BASE_SI: ${{ steps.lhmetrics.outputs.BASE_SI }}
          BASE_BYTE: ${{ steps.lhmetrics.outputs.BASE_BYTE }}
        with:
          script: |-
            const score = Number(process.env.SCORE || 0);
            const a11y = process.env.A11Y === 'null' ? null : Number(process.env.A11Y || 0);
            const bp = process.env.BP === 'null' ? null : Number(process.env.BP || 0);
            const seo = process.env.SEO === 'null' ? null : Number(process.env.SEO || 0);
            const pwa = process.env.PWA === 'null' ? null : Number(process.env.PWA || 0);
            const lcp = Number(process.env.LCP || 0);
            const base = (name) => {
              const raw = process.env[name];
              return raw && raw !== 'none' && raw !== 'null' ? Number(raw) : null;
            };
            const baseScore = base('BASE_SCORE');
            const baseA11y = base('BASE_A11Y');
            const baseBp = base('BASE_BP');
            const baseSeo = base('BASE_SEO');
            const basePwa = base('BASE_PWA');
            const baseLcp = base('BASE_LCP');
            const baseTbt = base('BASE_TBT');
            const baseCls = base('BASE_CLS');
            const baseFcp = base('BASE_FCP');
            const baseSi = base('BASE_SI');
            const baseByte = base('BASE_BYTE');
            const hasBaseline = baseScore !== null;
            const tbt = Number(process.env.TBT || 0);
            const cls = Number(process.env.CLS || 0);
            const byte = Number(process.env.BYTE || 0);
            const fcp = Number(process.env.FCP || 0);
            const speedIndex = Number(process.env.SPEEDINDEX || 0);

            const formatBytes = (b) => b >= 1024 * 1024
              ? `${(b / 1024 / 1024).toFixed(2)} MB`
              : `${Math.round(b / 1024)} kB`;

            const rating = (value, good, poor, unit = '') => {
              if (value <= good) return `🟢 Good${unit ? ` (≤ ${good}${unit})` : ''}`;
              if (value <= poor) return `🟡 Needs improvement (> ${good}${unit})`;
              return `🔴 Poor (> ${poor}${unit})`;
            };

            const scoreEmoji = score >= 0.9 ? '🟢' : score >= 0.5 ? '🟡' : '🔴';

            const catScore = (v) => v === null ? '—' : `${Math.round(v * 100)}/100`;
            const catEmoji = (v) => v === null ? '⚪ not measured' : v >= 0.9 ? '🟢' : v >= 0.5 ? '🟡' : '🔴';

            // Delta vs main baseline: higherIsBetter for scores, lowerIsBetter for metrics
            const delta = (value, baseValue, higherIsBetter, opts = {}) => {
              if (!hasBaseline || baseValue === null || value === null) return '';
              const diff = value - baseValue;
              if (Math.abs(diff) < (opts.epsilon ?? 0.0005)) return ' (=)';
              const better = higherIsBetter ? diff > 0 : diff < 0;
              const arrow = better ? '📈' : '📉';
              let formatted;
              if (opts.percent) {
                formatted = `${diff > 0 ? '+' : '−'}${Math.round(Math.abs(diff) * 100)} pp`;
              } else if (opts.round) {
                formatted = `${diff > 0 ? '+' : ''}${Math.round(Math.abs(diff))} ms${diff < 0 ? '' : ''}`;
                formatted = `${diff > 0 ? '+' : '−'}${Math.round(Math.abs(diff))} ms`;
              } else if (opts.fixed) {
                formatted = `${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(opts.fixed)}`;
              } else {
                formatted = `${diff > 0 ? '+' : '−'}${formatBytes(Math.abs(diff))}`;
              }
              return ` ${arrow} ${formatted} vs main`;
            };

            const body = `<!-- lighthouse-report -->
            ## ${scoreEmoji} Lighthouse Report — Performance Score ${Math.round(score * 100)}/100

            ### Category Scores

            | Category | Score | Rating | Δ vs main |
            |----------|-------|--------|-----------|
            | Performance | **${catScore(score)}** | ${catEmoji(score)} |${delta(score, baseScore, true, {percent: true})} |
            | Accessibility | ${catScore(a11y)} | ${catEmoji(a11y)} |${delta(a11y, baseA11y, true, {percent: true})} |
            | Best Practices | ${catScore(bp)} | ${catEmoji(bp)} |${delta(bp, baseBp, true, {percent: true})} |
            | SEO | ${catScore(seo)} | ${catEmoji(seo)} |${delta(seo, baseSeo, true, {percent: true})} |
            | PWA | ${catScore(pwa)} | ${catEmoji(pwa)} |${delta(pwa, basePwa, true, {percent: true})} |

            ### Performance Metrics

            | Metric | Value | Rating | Δ vs main |
            |--------|-------|--------|-----------|
            | LCP — Largest Contentful Paint | ${Math.round(lcp)} ms | ${rating(lcp, 2500, 4000, ' ms')} |${delta(lcp, baseLcp, false, {round: true})} |
            | TBT — Total Blocking Time | ${Math.round(tbt)} ms | ${rating(tbt, 300, 600, ' ms')} |${delta(tbt, baseTbt, false, {round: true})} |
            | CLS — Cumulative Layout Shift | ${cls.toFixed(3)} | ${rating(cls, 0.1, 0.25)} |${delta(cls, baseCls, false, {fixed: 3})} |
            | FCP — First Contentful Paint | ${Math.round(fcp)} ms | ${rating(fcp, 1800, 3000, ' ms')} |${delta(fcp, baseFcp, false, {round: true})} |
            | Speed Index | ${Math.round(speedIndex)} ms | |${delta(speedIndex, baseSi, false, {round: true})} |
            | Total Byte Weight | ${formatBytes(byte)} | ${rating(byte, 500000, 1500000)} |${delta(byte, baseByte, false)} |

            ${hasBaseline ? 'Deltas (Δ) compare against the last measured **main** branch run. 📈 = improved, 📉 = regressed.' : 'ℹ️ No main baseline available yet — deltas will show once the performance workflow has run on main.'}

            Core Web Vitals: 🟢 LCP ≤ 2500 ms · TBT ≤ 300 ms · CLS ≤ 0.1

            📊 Full HTML report available in the workflow **Artifacts** section (.lighthouseci).`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes('<!-- lighthouse-report -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
