# Build, lint and test the vue.js project using vite.
name: Build, Lint and Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint code
        run: bun run lint

      - name: Build project
        run: bun run build

      - name: Run tests
        # `github.event.inputs` is empty outside workflow_dispatch, so this
        # runs on every push and pull request and can only be skipped by hand.
        if: github.event.inputs.run_tests != 'false'
        run: bun run test
